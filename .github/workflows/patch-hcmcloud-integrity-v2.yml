name: One-shot HCMCloud first-page integrity patch v2

on:
  push:
    branches:
      - feat/hcmcloud-detail-hydration
    paths:
      - .github/workflows/patch-hcmcloud-integrity-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hcmcloud-detail-hydration

      - name: Patch first-page integrity handling
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path('campus_jobs/adapters/hcmcloud.py')
          text = path.read_text(encoding='utf-8')

          method_marker = '    @staticmethod\n    def _semantic_rows_from_text'
          assert text.count(method_marker) == 1
          helper_body = dedent('''
          @staticmethod
          def _metadata_terminal_reason(
              page_index: int,
              expected_total: int | None,
              expected_pages: int | None,
              job_count: int,
          ) -> str | None:
              page_number = page_index + 1
              # HCMCloud can briefly render a default "1 page" pager before
              # the async total/page metadata arrives. Never trust that first
              # page as terminal; force at least one real paging attempt.
              if page_index == 0 and (expected_pages is None or expected_pages <= 1):
                  return None
              if expected_total is not None and job_count >= expected_total:
                  if expected_pages is None or page_number >= expected_pages:
                      return "upstream-total"
              if expected_pages is not None and page_number >= expected_pages:
                  return "terminal"
              return None
          ''').strip('\n')
          text = text.replace(method_marker, indent(helper_body, '    ') + '\n\n' + method_marker, 1)

          rows_anchor = '            signatures: set[str] = set()\n'
          metadata_wait = (
              '            # Rows often render before HCMCloud\'s async total/pager metadata.\n'
              '            # Give the control plane a short stabilization window before deciding\n'
              '            # whether page 1 is terminal.\n'
              '            for _ in range(20):\n'
              '                try:\n'
              '                    metadata_text = clean_text(page.locator("body").inner_text())\n'
              '                except Exception:\n'
              '                    metadata_text = ""\n'
              '                total = self._expected_total(metadata_text)\n'
              '                if total is not None:\n'
              '                    expected_total = max(expected_total or 0, total)\n'
              '                page_total = self._expected_pages(metadata_text)\n'
              '                if page_total is not None:\n'
              '                    expected_pages = max(expected_pages or 0, page_total)\n'
              '                if expected_total is not None or (expected_pages or 0) > 1:\n'
              '                    break\n'
              '                page.wait_for_timeout(300)\n\n'
              '            signatures: set[str] = set()\n'
          )
          assert text.count(rows_anchor) == 1, f'rows anchor count={text.count(rows_anchor)}'
          text = text.replace(rows_anchor, metadata_wait, 1)

          old_terminal = (
              '                if expected_total is not None and len(jobs) >= expected_total:\n'
              '                    pagination_reason = "upstream-total"\n'
              '                    break\n'
              '                if expected_pages is not None and page_index + 1 >= expected_pages:\n'
              '                    pagination_reason = "terminal"\n'
              '                    break\n'
          )
          new_terminal = (
              '                terminal_reason = self._metadata_terminal_reason(\n'
              '                    page_index,\n'
              '                    expected_total,\n'
              '                    expected_pages,\n'
              '                    len(jobs),\n'
              '                )\n'
              '                if terminal_reason:\n'
              '                    pagination_reason = terminal_reason\n'
              '                    break\n'
          )
          assert text.count(old_terminal) == 1, f'terminal block count={text.count(old_terminal)}'
          text = text.replace(old_terminal, new_terminal, 1)

          old_integrity = (
              '        if expected_total is not None and not options.keyword:\n'
              '            target = min(expected_total, options.max_jobs)\n'
              '            if len(values) < target:\n'
              '                warnings.append(\n'
              '                    f"integrity incomplete: collected {len(values)}/{target} jobs "\n'
              '                    f"(upstream total={expected_total}, expected_pages={expected_pages}, "\n'
              '                    f"reason={pagination_reason}, method={pagination_method or \'-\'}, pages={pages_seen})"\n'
              '                )\n'
              '        elif pagination_reason in {"stalled", "no-next-control", "repeated-page", "max-pages"}:\n'
              '            warnings.append(\n'
              '                f"integrity unverified: pagination ended with reason={pagination_reason}, "\n'
              '                f"jobs={len(values)}, pages={pages_seen}"\n'
              '            )\n'
          )
          new_integrity = (
              '        first_page_unverified = (\n'
              '            not options.keyword\n'
              '            and pages_seen == 1\n'
              '            and pagination_reason == "no-next-control"\n'
              '            and (expected_pages is None or expected_pages <= 1)\n'
              '        )\n'
              '        if first_page_unverified:\n'
              '            warnings.append(\n'
              '                "integrity unverified: HCMCloud ended on the first rendered page "\n'
              '                f"without stable multi-page evidence; jobs={len(values)}, "\n'
              '                f"upstream total={expected_total}, expected_pages={expected_pages}"\n'
              '            )\n'
              '        elif expected_total is not None and not options.keyword:\n'
              '            target = min(expected_total, options.max_jobs)\n'
              '            if len(values) < target:\n'
              '                warnings.append(\n'
              '                    f"integrity incomplete: collected {len(values)}/{target} jobs "\n'
              '                    f"(upstream total={expected_total}, expected_pages={expected_pages}, "\n'
              '                    f"reason={pagination_reason}, method={pagination_method or \'-\'}, pages={pages_seen})"\n'
              '                )\n'
              '        elif not options.keyword and expected_total is None and expected_pages is None:\n'
              '            warnings.append(\n'
              '                "integrity unverified: upstream total and page count were unavailable; "\n'
              '                f"reason={pagination_reason}, jobs={len(values)}, pages={pages_seen}"\n'
              '            )\n'
              '        elif pagination_reason in {"stalled", "no-next-control", "repeated-page", "max-pages"}:\n'
              '            warnings.append(\n'
              '                f"integrity unverified: pagination ended with reason={pagination_reason}, "\n'
              '                f"jobs={len(values)}, pages={pages_seen}"\n'
              '            )\n'
          )
          assert text.count(old_integrity) == 1, f'integrity block count={text.count(old_integrity)}'
          text = text.replace(old_integrity, new_integrity, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_hcmcloud.py')
          test_text = tests.read_text(encoding='utf-8')
          if 'def test_first_page_default_pager_is_not_terminal()' not in test_text:
              test_text += dedent('''

              def test_first_page_default_pager_is_not_terminal():
                  assert HCMCloudAdapter._metadata_terminal_reason(0, None, 1, 20) is None
                  assert HCMCloudAdapter._metadata_terminal_reason(0, 20, 1, 20) is None


              def test_metadata_terminal_reason_respects_real_page_count():
                  assert HCMCloudAdapter._metadata_terminal_reason(0, 186, 10, 20) is None
                  assert HCMCloudAdapter._metadata_terminal_reason(9, 186, 10, 186) == "upstream-total"
                  assert HCMCloudAdapter._metadata_terminal_reason(9, None, 10, 186) == "terminal"
              ''')
          tests.write_text(test_text, encoding='utf-8')
          PY

          python -m compileall -q campus_jobs tests
          python -m pip install -U pip
          pip install -e '.[dev]'
          pytest tests/test_hcmcloud.py tests/test_generic_browser.py tests/test_detector.py
          ruff check --select E4,E7,E9,F campus_jobs tests
          git diff --check

      - name: Commit code and tests only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add campus_jobs/adapters/hcmcloud.py tests/test_hcmcloud.py
          git commit -m 'hcmcloud: distrust unstable first-page pagination'
          git push origin HEAD:feat/hcmcloud-detail-hydration
