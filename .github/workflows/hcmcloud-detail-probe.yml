name: HCMCloud detail probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler
        run: |
          python -m pip install -U pip
          pip install -e '.[browser,dev]'
          google-chrome --version || google-chrome-stable --version || chromium --version || true
      - name: Probe detail pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from campus_jobs.browser_support import chromium_launch_kwargs, dismiss_dynamic_overlays

          urls = [
              'https://inspur.hcmcloud.cn/recruit#/portal_job_detail?id=_HB5_NTkaNTk%253D',
              'https://inspur.hcmcloud.cn/recruit#/portal_job_detail?id=_HB5_NjAzNTQ%253D',
              'https://inspur.hcmcloud.cn/recruit#/portal_job_detail?id=_HB5_NTkaNDg%253D',
          ]
          report = []
          with sync_playwright() as p:
              browser = p.chromium.launch(**chromium_launch_kwargs())
              context = browser.new_context(viewport={'width': 1440, 'height': 1200})
              for target in urls:
                  page = context.new_page()
                  requests = []
                  responses = []
                  page.on('request', lambda req: requests.append({'method': req.method, 'url': req.url, 'post_data': req.post_data}) if '/api/' in req.url.lower() and len(requests) < 80 else None)
                  page.on('response', lambda resp: responses.append({'status': resp.status, 'url': resp.url}) if '/api/' in resp.url.lower() and len(responses) < 80 else None)
                  try:
                      page.goto(target, wait_until='domcontentloaded', timeout=45000)
                  except Exception as exc:
                      print('navigation', type(exc).__name__, exc)
                  page.wait_for_timeout(1800)
                  dismiss_dynamic_overlays(page, max_rounds=6)
                  page.wait_for_timeout(1800)
                  body = page.locator('body').inner_text()
                  interesting = page.evaluate('''() => [...document.querySelectorAll('*')]
                    .filter(el => {
                      const t = (el.innerText || '').trim();
                      if (!t || t.length > 1800) return false;
                      const s = `${el.className || ''} ${el.id || ''}`.toLowerCase();
                      return /job|position|detail|require|duty|desc|content|condition|qualification|职责|要求|任职|岗位|专业/.test(`${s} ${t}`);
                    })
                    .slice(0, 120)
                    .map(el => ({tag: el.tagName, cls: String(el.className || ''), id: el.id || '', text: (el.innerText || '').trim()}));''')
                  report.append({
                      'target': target,
                      'final_url': page.url,
                      'title': page.title(),
                      'body': body[:12000],
                      'interesting': interesting,
                      'requests': requests,
                      'responses': responses,
                  })
                  page.close()
              browser.close()
          out = Path('/tmp/hcmcloud-detail-probe.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2)[:50000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcmcloud-detail-probe
          path: /tmp/hcmcloud-detail-probe.json
          if-no-files-found: warn
