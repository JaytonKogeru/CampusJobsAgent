name: HCMCloud native detail probe

on:
  push:
    branches:
      - feat/hcmcloud-native-detail
    paths:
      - ".github/workflows/hcmcloud-native-detail-probe.yml"
      - "campus_jobs/adapters/hcmcloud.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler
        run: |
          python -m pip install -U pip
          pip install -e '.[browser,dev]'
          google-chrome --version || google-chrome-stable --version || chromium --version || true
      - name: Probe native row keys and detail routes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from playwright.sync_api import TimeoutError as PlaywrightTimeoutError
          from playwright.sync_api import sync_playwright
          from campus_jobs.browser_support import chromium_launch_kwargs, dismiss_dynamic_overlays

          URL = 'https://inspur.hcmcloud.cn/recruit#/portal_job_list?job_class=_HB5_Y2FtcHVz&filter_dict=_HB5_eyJf!m9iX2NsYXNzIjoiY2FtcHVzIiwic2VsZWN0X2RlcGFydCI6bnVsbH0%253D'
          report = {'source_url': URL, 'samples': []}

          with sync_playwright() as p:
              browser = p.chromium.launch(**chromium_launch_kwargs())
              context = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = context.new_page()
              page.goto(URL, wait_until='domcontentloaded', timeout=45000)
              page.wait_for_timeout(1800)
              dismiss_dynamic_overlays(page, max_rounds=6)

              selector = "[name='portal_job'] .flex-content .table-body .table-row[hcm-key]"
              try:
                  page.wait_for_selector(selector, state='visible', timeout=25000)
              except PlaywrightTimeoutError:
                  dismiss_dynamic_overlays(page, max_rounds=3)
                  page.wait_for_selector('.table-row[hcm-key]', state='visible', timeout=10000)
                  selector = '.table-row[hcm-key]'

              rows = page.locator(selector)
              report['row_count'] = rows.count()
              for i in range(min(rows.count(), 6)):
                  row = rows.nth(i)
                  key = row.get_attribute('hcm-key') or ''
                  title = row.locator("[col-key='name'] .cell-content").inner_text().strip()
                  sample = {'index': i, 'hcm_key': key, 'title': title}
                  try:
                      with context.expect_page(timeout=6000) as page_info:
                          row.locator("[col-key='name'] .cell-content").click(timeout=4000, force=True)
                      detail = page_info.value
                      detail.wait_for_timeout(350)
                      sample['detail_url'] = detail.url
                      detail.close()
                  except PlaywrightTimeoutError as exc:
                      sample['error'] = f'no detail page: {exc}'
                  except Exception as exc:
                      sample['error'] = f'{type(exc).__name__}: {exc}'
                  report['samples'].append(sample)
                  page.bring_to_front()
                  page.wait_for_timeout(250)

              browser.close()

          Path('/tmp/hcmcloud-native-detail-probe.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcmcloud-native-detail-probe
          path: /tmp/hcmcloud-native-detail-probe.json
          if-no-files-found: warn
