name: One-shot HCMCloud detail hydration patch v3

on:
  push:
    branches:
      - feat/hcmcloud-detail-hydration
    paths:
      - .github/workflows/patch-hcmcloud-detail-hydration-v3.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hcmcloud-detail-hydration

      - name: Run repaired patch template
        run: |
          python - <<'PY'
          from pathlib import Path

          raw = Path('.github/workflows/patch-hcmcloud-detail-hydration-v2.yml').read_text(encoding='utf-8')
          script = raw.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script = script.replace("old_constants = dedent(r'''\\\\\n", "old_constants = dedent(r'''\n", 1)
          script = script.replace("new_constants = dedent(r'''\\\\\n", "new_constants = dedent(r'''\n", 1)
          script = script.replace("''')\nnew_constants =", "''').lstrip()\nnew_constants =", 1)
          script = script.replace("''')\nassert text.count(old_constants)", "''').lstrip()\nassert text.count(old_constants)", 1)
          exec(compile(script, '<repaired-hcmcloud-patch>', 'exec'))
          PY

      - name: Verify patch
        run: |
          python -m compileall -q campus_jobs tests
          python -m pip install -U pip
          pip install -e '.[dev]'
          pytest tests/test_hcmcloud.py tests/test_generic_browser.py tests/test_detector.py
          ruff check --select E4,E7,E9,F campus_jobs tests
          git diff --check

      - name: Commit code and tests only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add campus_jobs/adapters/hcmcloud.py tests/test_hcmcloud.py
          git commit -m 'hcmcloud: hydrate rendered job details'
          git push origin HEAD:feat/hcmcloud-detail-hydration
