name: HCMCloud detail probe

on:
  push:
    branches:
      - feat/hcmcloud-detail-hydration
    paths:
      - .github/workflows/hcmcloud-detail-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler
        run: |
          python -m pip install -U pip
          pip install -e '.[browser,dev]'
      - name: Benchmark ten detail hydrations in one SPA session
        run: |
          python - <<'PY'
          import json
          import statistics
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from campus_jobs.browser_support import chromium_launch_kwargs, dismiss_dynamic_overlays

          listing = 'https://inspur.hcmcloud.cn/recruit#/portal_job_list?job_class=_HB5_Y2FtcHVz&filter_dict=_HB5_eyJf!m9iX2NsYXNzIjoiY2FtcHVzIiwic2VsZWN0X2RlcGFydCI6bnVsbH0%253D'
          report = {'listing': listing, 'items': []}
          with sync_playwright() as p:
              browser = p.chromium.launch(**chromium_launch_kwargs())
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              t0 = time.perf_counter()
              page.goto(listing, wait_until='domcontentloaded', timeout=45000)
              page.wait_for_timeout(2500)
              dismiss_dynamic_overlays(page, max_rounds=8)
              page.wait_for_timeout(900)
              rows = []
              for _ in range(25):
                  rows = page.evaluate('''() => [...document.querySelectorAll('.table-body .table-row[hcm-key]')].filter(row => {
                    const r = row.getBoundingClientRect();
                    const s = getComputedStyle(row);
                    return r.width > 2 && r.height > 2 && s.display !== 'none' && s.visibility !== 'hidden';
                  }).slice(0, 10).map(row => {
                    const id = String(row.getAttribute('hcm-key') || '');
                    const title = (row.querySelector('.table-cell[col-key="name"] .cell-content')?.innerText || '').trim();
                    const encoded = String(window.hcmUrlParamEncoder(id));
                    return {id, title, hash: '#/portal_job_detail?id=' + encodeURIComponent(encoded)};
                  })''')
                  if rows:
                      break
                  dismiss_dynamic_overlays(page, max_rounds=2)
                  page.wait_for_timeout(400)
              if not rows:
                  raise RuntimeError('list did not render native HCMCloud rows')
              report['list_ready_s'] = round(time.perf_counter() - t0, 3)

              for item in rows:
                  started = time.perf_counter()
                  error = ''
                  desc = ''
                  try:
                      page.evaluate('(h) => { window.location.hash = h; }', item['hash'])
                      page.wait_for_function('''expected => {
                        const root = document.querySelector('.portal-job-detail-pc');
                        if (!root || typeof window.angular === 'undefined') return false;
                        const scope = angular.element(root).scope();
                        if (!scope || String(scope.job_id || '') !== String(expected)) return false;
                        const detail = scope.job_detail || {};
                        const node = root.querySelector('[key="job_desc"] .component-input-inner.ng-binding');
                        const text = String(detail.job_desc || (node && node.textContent) || '').trim();
                        return text.length > 20;
                      }''', arg=item['id'], timeout=8000)
                      desc = page.evaluate('''() => {
                        const root = document.querySelector('.portal-job-detail-pc');
                        const scope = angular.element(root).scope();
                        const detail = scope.job_detail || {};
                        const node = root.querySelector('[key="job_desc"] .component-input-inner.ng-binding');
                        return String(detail.job_desc || (node && node.textContent) || '').trim();
                      }''')
                  except Exception as exc:
                      error = f'{type(exc).__name__}: {exc}'
                  elapsed = round(time.perf_counter() - started, 3)
                  report['items'].append({**item, 'seconds': elapsed, 'description_length': len(desc), 'has_duties': '职责' in desc, 'has_requirements': '要求' in desc, 'error': error})

              times = [x['seconds'] for x in report['items'] if not x['error']]
              report['summary'] = {
                  'ok': len(times),
                  'failed': len(report['items']) - len(times),
                  'mean_s': round(statistics.mean(times), 3) if times else None,
                  'median_s': round(statistics.median(times), 3) if times else None,
                  'max_s': max(times) if times else None,
              }
              browser.close()

          Path('/tmp/hcmcloud-detail-probe.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcmcloud-detail-probe
          path: /tmp/hcmcloud-detail-probe.json
          if-no-files-found: warn
