name: HCMCloud detail probe

on:
  push:
    branches:
      - feat/hcmcloud-detail-hydration
    paths:
      - .github/workflows/hcmcloud-detail-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler
        run: |
          python -m pip install -U pip
          pip install -e '.[browser,dev]'
      - name: Probe detail inside accepted list session
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from campus_jobs.browser_support import chromium_launch_kwargs, dismiss_dynamic_overlays

          listing = 'https://inspur.hcmcloud.cn/recruit#/portal_job_list?job_class=_HB5_Y2FtcHVz&filter_dict=_HB5_eyJf!m9iX2NsYXNzIjoiY2FtcHVzIiwic2VsZWN0X2RlcGFydCI6bnVsbH0%253D'
          report = {'listing': listing, 'api': []}
          with sync_playwright() as p:
              browser = p.chromium.launch(**chromium_launch_kwargs())
              page = browser.new_page(viewport={'width': 1440, 'height': 1200})
              page.goto(listing, wait_until='domcontentloaded', timeout=45000)
              page.wait_for_timeout(1500)
              report['dismissed'] = dismiss_dynamic_overlays(page, max_rounds=8)
              page.wait_for_selector('.table-row[hcm-key]', state='visible', timeout=25000)
              first = page.locator('.table-row[hcm-key]').first
              job_id = first.get_attribute('hcm-key')
              encoded = page.evaluate('(id) => String(window.hcmUrlParamEncoder(id))', job_id)
              detail_hash = '#/portal_job_detail?id=' + page.evaluate('(x) => encodeURIComponent(x)', encoded)
              report['job_id'] = job_id
              report['detail_hash'] = detail_hash

              def on_response(resp):
                  low = resp.url.lower()
                  if not any(token in low for token in (
                      'recruit.get.apply.info.by.job',
                      'rec.choice.get.choice.by.job',
                      'hcm.model.meta?model=releasejobmgr',
                  )):
                      return
                  item = {'status': resp.status, 'url': resp.url}
                  try:
                      item['text'] = resp.text()[:20000]
                  except Exception as exc:
                      item['text_error'] = f'{type(exc).__name__}: {exc}'
                  report['api'].append(item)

              page.on('response', on_response)
              page.evaluate('(h) => { window.location.hash = h; }', detail_hash)
              for _ in range(30):
                  page.wait_for_timeout(400)
                  dismiss_dynamic_overlays(page, max_rounds=1)
                  body = page.locator('body').inner_text()
                  if any(key in body for key in ('岗位职责', '职位职责', '任职要求', '岗位要求', '专业要求')):
                      break

              report['final_url'] = page.url
              report['body'] = page.locator('body').inner_text()[:20000]
              detail = page.locator('.portal-job-detail-pc')
              report['detail_html'] = detail.inner_html()[:40000] if detail.count() else ''
              report['scope'] = page.evaluate('''() => {
                const el = document.querySelector('.portal-job-detail-pc');
                if (!el || typeof window.angular === 'undefined') return null;
                let scope = angular.element(el).scope();
                const out = {};
                for (let depth = 0; scope && depth < 4; depth++, scope = scope.$parent) {
                  for (const [k, v] of Object.entries(scope)) {
                    if (k.startsWith('$') || typeof v === 'function') continue;
                    try {
                      const s = JSON.stringify(v);
                      if (s && s.length < 50000 && /job|apply|position|detail|duty|require|description|content|work|education|background/i.test(k + ' ' + s)) {
                        out[`d${depth}:${k}`] = JSON.parse(s);
                      }
                    } catch (e) {}
                  }
                }
                return out;
              }''')
              browser.close()

          Path('/tmp/hcmcloud-detail-probe.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2)[:100000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcmcloud-detail-probe
          path: /tmp/hcmcloud-detail-probe.json
          if-no-files-found: warn
