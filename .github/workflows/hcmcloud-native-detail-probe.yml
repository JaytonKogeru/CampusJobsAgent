name: HCMCloud native detail probe

on:
  push:
    branches:
      - feat/hcmcloud-native-detail
    paths:
      - ".github/workflows/hcmcloud-native-detail-probe.yml"
      - "campus_jobs/adapters/hcmcloud.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler
        run: |
          python -m pip install -U pip
          pip install -e '.[browser,dev]'
          google-chrome --version || google-chrome-stable --version || chromium --version || true
      - name: Inspect HCMCloud URL encoder
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from playwright.sync_api import sync_playwright
          from campus_jobs.browser_support import chromium_launch_kwargs, dismiss_dynamic_overlays

          URL = 'https://inspur.hcmcloud.cn/recruit#/portal_job_list?job_class=_HB5_Y2FtcHVz&filter_dict=_HB5_eyJf!m9iX2NsYXNzIjoiY2FtcHVzIiwic2VsZWN0X2RlcGFydCI6bnVsbH0%253D'
          ids = ['59959', '60354', '59880', '59970', '60007', '59966']
          report = {'source_url': URL, 'encodings': {}}

          with sync_playwright() as p:
              browser = p.chromium.launch(**chromium_launch_kwargs())
              context = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = context.new_page()
              page.goto(URL, wait_until='domcontentloaded', timeout=45000)
              page.wait_for_timeout(1800)
              dismiss_dynamic_overlays(page, max_rounds=6)
              page.wait_for_selector('.table-row[hcm-key]', state='visible', timeout=25000)

              report['encoder_type'] = page.evaluate('() => typeof window.hcmUrlParamEncoder')
              report['decoder_type'] = page.evaluate('() => typeof window.hcmUrlParamDecoder')
              for job_id in ids:
                  report['encodings'][job_id] = page.evaluate('''jobId => {
                    const raw = String(window.hcmUrlParamEncoder(jobId));
                    let decoded = null;
                    try { decoded = String(window.hcmUrlParamDecoder(raw)); } catch (e) { decoded = String(e); }
                    return {
                      raw,
                      encodeURIComponent: encodeURIComponent(raw),
                      decoded,
                      directHash: '#/portal_job_detail?id=' + raw,
                      encodedHash: '#/portal_job_detail?id=' + encodeURIComponent(raw),
                    };
                  }''', job_id)
              browser.close()

          Path('/tmp/hcmcloud-native-detail-probe.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcmcloud-native-detail-probe
          path: /tmp/hcmcloud-native-detail-probe.json
          if-no-files-found: warn
