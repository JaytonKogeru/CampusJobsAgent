name: HCMCloud native detail probe

on:
  push:
    branches:
      - feat/hcmcloud-native-detail
    paths:
      - ".github/workflows/hcmcloud-native-detail-probe.yml"
      - "campus_jobs/adapters/hcmcloud.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler
        run: |
          python -m pip install -U pip
          pip install -e '.[browser,dev]'
          google-chrome --version || google-chrome-stable --version || chromium --version || true
      - name: Trace HCMCloud HB5 encoder
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          from playwright.sync_api import sync_playwright
          from campus_jobs.browser_support import chromium_launch_kwargs, dismiss_dynamic_overlays

          URL = 'https://inspur.hcmcloud.cn/recruit#/portal_job_list?job_class=_HB5_Y2FtcHVz&filter_dict=_HB5_eyJf!m9iX2NsYXNzIjoiY2FtcHVzIiwic2VsZWN0X2RlcGFydCI6bnVsbH0%253D'
          needles = [r'_HB5_', r'HB5', r'hb5', r'base64', r'btoa\(', r'atob\(', r'encodeURIComponent', r'decodeURIComponent']
          report = {'source_url': URL, 'scripts': [], 'matches': []}

          with sync_playwright() as p:
              browser = p.chromium.launch(**chromium_launch_kwargs())
              context = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = context.new_page()
              page.goto(URL, wait_until='domcontentloaded', timeout=45000)
              page.wait_for_timeout(1800)
              dismiss_dynamic_overlays(page, max_rounds=6)
              page.wait_for_selector('.table-row[hcm-key]', state='visible', timeout=25000)

              sources = page.evaluate('''() => [...new Set([
                ...[...document.scripts].map(s => s.src).filter(Boolean),
                ...performance.getEntriesByType('resource').map(r => r.name).filter(x => /\\.js(?:[?#]|$)/i.test(x))
              ])]''')
              for raw in sources:
                  src = urljoin(page.url, raw)
                  if 'hcmcloud.cn' not in src:
                      continue
                  item = {'url': src}
                  try:
                      resp = context.request.get(src, timeout=20000)
                      item['status'] = resp.status
                      text = resp.text()
                      item['bytes'] = len(text)
                      for needle in needles:
                          for match in list(re.finditer(needle, text, re.I))[:8]:
                              start = max(0, match.start() - 700)
                              end = min(len(text), match.end() + 1100)
                              snippet = text[start:end].replace('\n', ' ')
                              report['matches'].append({
                                  'url': src,
                                  'needle': needle,
                                  'offset': match.start(),
                                  'snippet': snippet,
                              })
                              if len(report['matches']) >= 80:
                                  break
                          if len(report['matches']) >= 80:
                              break
                  except Exception as exc:
                      item['error'] = f'{type(exc).__name__}: {exc}'
                  report['scripts'].append(item)
                  if len(report['matches']) >= 80:
                      break
              browser.close()

          Path('/tmp/hcmcloud-native-detail-probe.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps({
              'script_count': len(report['scripts']),
              'matches': report['matches'][:30],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcmcloud-native-detail-probe
          path: /tmp/hcmcloud-native-detail-probe.json
          if-no-files-found: warn
