name: One-shot HCMCloud native detail patch

on:
  push:
    branches:
      - feat/hcmcloud-native-detail
    paths:
      - .github/workflows/patch-hcmcloud-native-detail.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hcmcloud-native-detail

      - name: Patch adapter and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('campus_jobs/adapters/hcmcloud.py')
          text = adapter.read_text(encoding='utf-8')

          old_import = 'from urllib.parse import quote, urlparse\n'
          assert text.count(old_import) == 1, f'import match count={text.count(old_import)}'
          text = text.replace(old_import, 'from urllib.parse import urlparse\n', 1)

          old_attr = "      if (attr.name === 'id' || attr.name.startsWith('data-')) attrs[`${prefix}${attr.name}`] = attr.value;"
          new_attr = "      if (attr.name === 'id' || attr.name === 'hcm-key' || attr.name.startsWith('data-')) attrs[`${prefix}${attr.name}`] = attr.value;"
          assert text.count(old_attr) == 1, f'attrMap match count={text.count(old_attr)}'
          text = text.replace(old_attr, new_attr, 1)

          marker = '  // Some HCMCloud tenants use a native table.'
          assert text.count(marker) == 1, f'grid marker count={text.count(marker)}'
          grid_block = '\n'.join([
              '  // Current HCMCloud public portals render the job list as a div-based',
              '  // grid. Each row exposes the underlying ReleaseJobMgr id in hcm-key.',
              "  // Use HCMCloud's own URL encoder in-page instead of reimplementing its",
              '  // private _HB5_ transformation.',
              "  const gridKeys = ['name', 'u_company_name', 'work_city', 'background', 'release_date', 'job_category'];",
              "  const gridHeaders = ['职位名称', '所属单位', '工作城市', '学历要求', '发布时间', '职位类别'];",
              "  for (const node of document.querySelectorAll('.table-body .table-row[hcm-key]')) {",
              '    if (!visible(node)) continue;',
              "    const nativeId = (node.getAttribute('hcm-key') || '').trim();",
              '    if (!nativeId) continue;',
              '',
              '    const byKey = {};',
              "    for (const cell of node.querySelectorAll('.table-cell[col-key]')) {",
              "      const key = (cell.getAttribute('col-key') || '').trim();",
              '      if (!key) continue;',
              "      const content = cell.querySelector('.cell-content') || cell;",
              "      byKey[key] = (content.innerText || '').replace(/\\u00a0/g, ' ').trim();",
              '    }',
              "    const cells = gridKeys.map((key) => byKey[key] || '');",
              "    const title = (cells[0] || '').trim();",
              '    if (title.length < 2 || title.length > 120 || badTitle.test(title)) continue;',
              '',
              "    let href = '';",
              "    let encodedId = '';",
              '    try {',
              "      if (typeof window.hcmUrlParamEncoder === 'function') {",
              "        encodedId = String(window.hcmUrlParamEncoder(nativeId) || '');",
              "        if (encodedId) href = `#/portal_job_detail?id=${encodeURIComponent(encodedId)}`;",
              '      }',
              '    } catch (e) {',
              "      encodedId = '';",
              '    }',
              '',
              '    out.push({',
              '      title,',
              '      href,',
              "      text: cells.filter(Boolean).join('\\n'),",
              '      lines: cells.filter(Boolean),',
              '      cells,',
              '      headers: gridHeaders,',
              "      className: String(node.className || ''),",
              '      attrs: attrMap(node),',
              '      nativeId,',
              '      encodedId,',
              "      kind: 'hcmcloud-grid'",
              '    });',
              '    seenNodes.add(node);',
              '  }',
              '',
          ])
          text = text.replace(marker, grid_block + marker, 1)

          old_extract = '    def _extract_id(row: dict[str, object]) -> str:\n        href = clean_text(row.get("href"))\n'
          new_extract = '    def _extract_id(row: dict[str, object]) -> str:\n        native_id = clean_text(row.get("nativeId"))\n        if native_id:\n            return native_id\n\n        href = clean_text(row.get("href"))\n'
          assert text.count(old_extract) == 1, f'extract-id match count={text.count(old_extract)}'
          text = text.replace(old_extract, new_extract, 1)

          old_guard = '                if "job" not in low and "position" not in low and low not in {"data-id", "id", "a:data-id"}:\n                    continue\n'
          new_guard = '                if "job" not in low and "position" not in low and low not in {\n                    "data-id",\n                    "id",\n                    "a:data-id",\n                    "hcm-key",\n                }:\n                    continue\n'
          assert text.count(old_guard) == 1, f'attr-id guard match count={text.count(old_guard)}'
          text = text.replace(old_guard, new_guard, 1)

          old_url = '        parsed = urlparse(source_url)\n        root = f"{parsed.scheme or \'https\'}://{parsed.netloc}"\n        if job_id and not job_id.startswith("dom-"):\n            return f"{root}/recruit#/portal_job_detail?job_id={quote(job_id, safe=\'\')}"\n        return source_url\n'
          new_url = "        # HCMCloud's detail route encodes ids through its frontend\n        # hcmUrlParamEncoder. The rendered-grid extractor stores that exact\n        # official route in href; do not fabricate an unverified id parameter.\n        return source_url\n"
          assert text.count(old_url) == 1, f'job-url match count={text.count(old_url)}'
          text = text.replace(old_url, new_url, 1)
          adapter.write_text(text, encoding='utf-8')

          tests = Path('tests/test_hcmcloud.py')
          test_text = tests.read_text(encoding='utf-8')
          if 'def test_extract_native_hcmcloud_id()' not in test_text:
              test_text += '\n\n' + '\n'.join([
                  'def test_extract_native_hcmcloud_id():',
                  '    row = {"href": "", "nativeId": "59959", "attrs": {"hcm-key": "59959"}}',
                  '    assert HCMCloudAdapter._extract_id(row) == "59959"',
                  '',
                  '',
                  'def test_extract_native_hcmcloud_id_from_hcm_key_attribute():',
                  '    row = {"href": "", "attrs": {"hcm-key": "60354"}}',
                  '    assert HCMCloudAdapter._extract_id(row) == "60354"',
                  '',
                  '',
                  'def test_native_detail_href_is_preserved():',
                  '    row = {',
                  '        "href": "#/portal_job_detail?id=_HB5_NTkaNTk%253D",',
                  '        "nativeId": "59959",',
                  '        "attrs": {"hcm-key": "59959"},',
                  '    }',
                  '    assert HCMCloudAdapter._job_url(',
                  '        "https://inspur.hcmcloud.cn/recruit#/portal_job_list",',
                  '        row,',
                  '        "59959",',
                  '    ) == "https://inspur.hcmcloud.cn/recruit#/portal_job_detail?id=_HB5_NTkaNTk%253D"',
                  '',
              ])
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Verify patch locally in runner
        run: |
          python -m compileall -q campus_jobs tests
          git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add campus_jobs/adapters/hcmcloud.py tests/test_hcmcloud.py
          git commit -m 'hcmcloud: use native job ids and detail routes'
          git push origin HEAD:feat/hcmcloud-native-detail
