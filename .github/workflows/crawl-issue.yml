name: Crawl from issue

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing crawl issue number to retry
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: campus-jobs-crawler-write
  cancel-in-progress: false

jobs:
  crawl:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[crawl]')
    runs-on: ubuntu-latest
    env:
      CAMPUS_JOBS_PROXY: ${{ secrets.CAMPUS_JOBS_PROXY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler
        run: |
          python -m pip install -U pip
          pip install -e '.[browser]'
          google-chrome --version || google-chrome-stable --version || chromium --version || true

      - name: Resolve crawl event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NO="${{ inputs.issue_number }}"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NO}" \
              --jq '{issue:{number:.number,title:.title,body:.body}}' > /tmp/crawl-event.json
            CRAWL_EVENT=/tmp/crawl-event.json
          else
            ISSUE_NO="${{ github.event.issue.number }}"
            CRAWL_EVENT="$GITHUB_EVENT_PATH"
          fi
          echo "ISSUE_NO=$ISSUE_NO" >> "$GITHUB_ENV"
          echo "CRAWL_EVENT=$CRAWL_EVENT" >> "$GITHUB_ENV"

      - name: Crawl
        id: crawl
        run: |
          python -m campus_jobs.issue_runner --event "$CRAWL_EVENT" --output-dir runs > /tmp/run.json
          cat /tmp/run.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          data = json.load(open('/tmp/run.json', encoding='utf-8'))
          count = int(data.get('count') or 0)
          adapter = str(data.get('adapter') or '')
          warnings = [str(item) for item in (data.get('warnings') or [])]
          text = '\n'.join(warnings).lower()
          degraded_tokens = (
              'quality=0/',
              'pagination incomplete',
              'pagination stalled',
              'integrity incomplete',
              'integrity unverified',
              'detail hydration incomplete',
              'rendered no job rows',
              'returned no active',
          )
          degraded = count == 0 or adapter.endswith('-error') or any(token in text for token in degraded_tokens)
          headline = '抓取完成，但结果存在完整性风险，请复核。' if degraded else '抓取完成。'
          print(f'count={count}')
          print(f'degraded={str(degraded).lower()}')
          print(f'headline={headline}')
          PY

      - name: Commit normalized results
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "campus-jobs-agent[bot]"
          git config user.email "campus-jobs-agent[bot]@users.noreply.github.com"
          git add runs/
          if ! git diff --cached --quiet; then
            git commit -m "crawl: issue #${ISSUE_NO}"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Comment issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="runs/issue-${ISSUE_NO}/summary.md"
          {
            echo "${{ steps.crawl.outputs.headline }} 共发现 **${{ steps.crawl.outputs.count }}** 个岗位。"
            if [ "${{ steps.crawl.outputs.degraded }}" = "true" ]; then
              echo
              echo "> ⚠️ 本次结果被自动标记为低质量/不完整，不能直接当作官网全量岗位使用。"
            fi
            echo
            echo "结果已提交到：\`runs/issue-${ISSUE_NO}/jobs.json\`"
            echo
            cat "$FILE"
          } | gh issue comment "$ISSUE_NO" --body-file -
